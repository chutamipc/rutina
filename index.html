<!--
  Mi rutina: pagina personal de entrenamiento, dieta y progreso.
  Sin frameworks ni build. Archivos:
    css/estilos.css   diseno (celular y PC)
    js/plan.js        el plan: fases, calorias, ejercicios, comidas  <- lo que mas se cambia
    js/datos.js       utilidades, fechas, almacenamiento y calculos
    js/graficas.js    graficas de linea
    js/vistas.js      pestanas: Hoy, Rutina, Dieta, Progreso, Guia
    js/sesion.js      registro de series y temporizador
    js/nube.js        Firebase: inicio de sesion y sincronizacion
    js/eventos.js     botones, copias de seguridad y avisos
    js/inicio.js      arranque y app instalable
  Para probar otra fecha: agregar ?fecha=2026-12-01 a la URL.
-->

<header class="top">

  <span id="pill" class="pill"></span>

</header>

</nav>
<main id="contenido">
  <section id="tab-hoy" class="tab activa" aria-label="Hoy"></section>
  <section id="tab-rutina" class="tab" aria-label="Rutina"></section>
  <section id="tab-dieta" class="tab" aria-label="Dieta"></section>
  <section id="tab-progreso" class="tab" aria-label="Progreso"></section>
  <section id="tab-guia" class="tab" aria-label="Guía"></section>
</main>
<div id="inicio" class="inicio" role="dialog" aria-modal="true" aria-labelledby="inicio-titulo" hidden>
  <div class="inicio-caja">
    <svg class="inicio-marca" aria-hidden="true"><use href="#i-marca"/></svg>
    <h1 id="inicio-titulo">Mi rutina</h1>
    <p>Tu entrenamiento, tu dieta y tu progreso, en el celular y en la PC.</p>
    <p id="inicio-estado" class="nota" aria-live="polite">Cargando…</p>
    <button class="btn btn-tipo t-torso bloque grande" id="inicio-entrar" data-acc="entrar" hidden><svg class="ico" aria-hidden="true"><use href="#i-user"/></svg>Entrar con Google</button>
    <button class="btn btn-sec bloque" id="inicio-local" data-acc="sin-cuenta" hidden>Seguir sin cuenta, solo en este equipo</button>
    <p class="nota">La sesión queda abierta en este equipo hasta que la cierres.</p>
  </div>
</div>
<div id="panel" class="panel" hidden role="dialog" aria-modal="true"></div>
<div id="timer" class="timer" hidden role="timer" aria-label="Descanso">
  <div class="timer-info"><span>Descanso</span><b id="timer-num">0:00</b></div>
  <div class="timer-acc"><button class="btn btn-sec" data-acc="timer-mas">+30 s</button><button class="btn btn-sec" data-acc="timer-parar">Listo</button></div>
  <div class="timer-barra"><i id="timer-barra"></i></div>
</div>
<div id="toast" class="toast" hidden role="status" aria-live="polite"></div>
<input type="file" id="archivo" accept=".txt,.json,text/plain,application/json" hidden>
