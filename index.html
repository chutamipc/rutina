<!DOCTYPE html>
<html lang="es-EC">
<head>
<!--
  Mi rutina: pagina personal de entrenamiento, dieta y progreso.
  Sin frameworks ni build. Archivos:
    css/estilos.css  diseno (celular y PC)
    js/plan.js       el plan: fases, calorias, ejercicios, comidas  <- lo que mas se cambia
    js/app.js        la logica: Hoy, sesiones, dieta, progreso, guia
    js/nube.js       Firebase: inicio de sesion y sincronizacion
    js/inicio.js     arranque
  Para probar otra fecha: agregar ?fecha=2026-12-01 a la URL.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://apis.google.com https://*.firebaseapp.com; connect-src 'self' https://*.googleapis.com https://www.gstatic.com https://apis.google.com https://*.firebaseapp.com; frame-src https://*.firebaseapp.com https://accounts.google.com https://apis.google.com; img-src 'self' data: blob: https://*.googleusercontent.com https://www.gstatic.com; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#0e1014">
<meta name="color-scheme" content="dark">
<title>Mi rutina · Definición</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%8B%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>
<header class="top"><h1>🏋️ Mi rutina</h1><div class="top-der"><span id="pill" class="pill"></span><button id="cuenta" class="cuenta" data-acc="cuenta">☁️ Entrar</button></div></header>
<main>
  <section id="tab-hoy" class="tab activa" aria-label="Hoy"></section>
  <section id="tab-rutina" class="tab" aria-label="Rutina"></section>
  <section id="tab-dieta" class="tab" aria-label="Dieta"></section>
  <section id="tab-progreso" class="tab" aria-label="Progreso"></section>
  <section id="tab-guia" class="tab" aria-label="Guía"></section>
</main>
<div id="inicio" class="inicio" role="dialog" aria-modal="true" aria-labelledby="inicio-titulo" hidden>
  <div class="inicio-caja">
    <div class="logo">🏋️</div>
    <h1 id="inicio-titulo">Mi rutina</h1>
    <p class="suave">Entrenamiento, dieta y progreso.</p>
    <p id="inicio-estado" class="chico suave" aria-live="polite">Cargando…</p>
    <button class="btn bloque" id="inicio-entrar" data-acc="entrar" hidden>Entrar con Google</button>
    <button class="btn sec bloque" id="inicio-local" data-acc="sin-cuenta" hidden>Continuar sin cuenta (solo este equipo)</button>
    <p class="chico suave" style="margin-top:1rem">Tu sesión queda guardada en este equipo hasta que la cierres.</p>
  </div>
</div>
<div id="panel" class="panel" hidden role="dialog" aria-modal="true"></div>
<div id="timer" class="timer" hidden aria-live="polite">
  <b id="timer-num">0:00</b><div class="barrita"><i id="timer-barra"></i></div>
  <button class="btn sec mini" data-acc="timer-mas">+30 s</button>
  <button class="btn sec mini" data-acc="timer-parar">Parar</button>
</div>
<nav class="nav" aria-label="Secciones">
  <button data-tab="hoy" aria-current="page"><span class="ico">📅</span>Hoy</button>
  <button data-tab="rutina"><span class="ico">🏋️</span>Rutina</button>
  <button data-tab="dieta"><span class="ico">🍽️</span>Dieta</button>
  <button data-tab="progreso"><span class="ico">📈</span>Progreso</button>
  <button data-tab="guia"><span class="ico">📘</span>Guía</button>
</nav>
<div id="toast" class="toast" hidden role="status"></div>
<input type="file" id="archivo" accept=".txt,.json,text/plain,application/json" hidden>

<script src="js/plan.js"></script>
<script src="js/app.js"></script>
<script src="js/nube.js"></script>
<script src="js/inicio.js"></script>
</body>
</html>
