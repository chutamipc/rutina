<!DOCTYPE html>
<html lang="es-EC">
<head>
<!--
  Rutina y dieta: pagina personal.
  Una sola hoja: HTML + CSS + JS en este archivo, sin frameworks ni build.
  No esta enlazada desde la pagina principal y pide a los buscadores que no
  la muestren (meta robots noindex).

  ==========================================================================
  PARA CAMBIAR EL PLAN (fechas, calorias, ejercicios, series, comidas)
  Ve al script del final y busca el bloque que dice "PLAN - CAMBIAR AQUI".
  ==========================================================================

  Lo que se anota (pesos, medidas, checks) se guarda solo en el navegador
  del celular (localStorage, clave "rutina-v1"). No se sube a GitHub.
  Respaldo: pestana Progreso > Tus datos > Exportar respaldo.

  Para probar otra fecha: agregar ?fecha=2026-12-01 a la URL.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://apis.google.com https://*.firebaseapp.com; connect-src 'self' https://*.googleapis.com https://www.gstatic.com https://apis.google.com https://*.firebaseapp.com; frame-src https://*.firebaseapp.com https://accounts.google.com https://apis.google.com; img-src 'self' data: blob: https://*.googleusercontent.com https://www.gstatic.com; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#0e1014">
<meta name="color-scheme" content="dark">
<title>Mi rutina · Definición</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%8B%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>
:root{--fondo:#0e1014;--tarjeta:#171a21;--tarjeta-2:#1f232c;--borde:#2a2f3a;--texto:#e9ebef;--suave:#9ba3af;--acento:#ff7a33;--acento-2:#ffb35c;--ok:#38d27a;--mal:#ff6b6b;--nav:62px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fondo);color:var(--texto);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 20px)}
body.con-panel{overflow:hidden}
h1,h2,h3{line-height:1.25;margin:0 0 .45rem}
h2{font-size:1.12rem}h3{font-size:1rem}
p{margin:.35rem 0}
ul,ol{margin:.3rem 0;padding-left:1.2rem}
li{margin:.3rem 0}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding:.7rem 1rem;padding-top:calc(.7rem + env(safe-area-inset-top));background:rgba(14,16,20,.94);border-bottom:1px solid var(--borde)}
.top h1{font-size:1.05rem;margin:0}
.pill{font-size:.78rem;padding:.2rem .6rem;border-radius:999px;background:var(--tarjeta-2);border:1px solid var(--borde);color:var(--acento-2);white-space:nowrap}
main{max-width:640px;margin:0 auto;padding:1rem}
.tab{display:none}.tab.activa{display:block}
.tarjeta{background:var(--tarjeta);border:1px solid var(--borde);border-radius:14px;padding:1rem;margin-bottom:1rem;display:block}
.destacada{border-color:rgba(255,122,51,.55);background:linear-gradient(180deg,rgba(255,122,51,.12),var(--tarjeta) 70%)}
.suave{color:var(--suave)}.chico{font-size:.88rem}
.ok-txt{color:var(--ok)}.mal-txt{color:var(--mal)}
.fila{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}.entre{justify-content:space-between}
.btn{appearance:none;border:0;border-radius:12px;padding:.75rem 1rem;font:inherit;font-weight:600;cursor:pointer;background:var(--acento);color:#1a0d05;min-height:44px}
.btn.sec{background:var(--tarjeta-2);color:var(--texto);border:1px solid var(--borde)}
.btn.mini{padding:.4rem .7rem;min-height:36px;font-size:.88rem}
.btn.bloque{width:100%}
.btn.peligro{background:#3a1717;color:#ffb4b4;border:1px solid #5c2424}
.aviso{background:rgba(245,197,66,.1);border:1px solid rgba(245,197,66,.35);color:#ffe08a;border-radius:10px;padding:.5rem .7rem;font-size:.9rem;margin:.5rem 0}
.metas{display:grid;grid-template-columns:repeat(4,1fr);gap:.45rem;margin:.6rem 0}
.meta{background:var(--tarjeta-2);border-radius:10px;padding:.45rem .2rem;text-align:center}
.meta b{display:block;font-size:1.05rem}.meta span{font-size:.72rem;color:var(--suave)}
.semana{display:grid;grid-template-columns:repeat(6,1fr);gap:.35rem}
.dia{border-radius:10px;padding:.4rem .15rem;text-align:center;background:var(--tarjeta-2);border:1px solid var(--borde);font-size:.7rem;line-height:1.25}
.dia b{display:block;font-size:.78rem}
.dia.hecha{border-color:var(--ok);color:var(--ok)}
.dia.hoy{border-color:var(--acento);color:var(--acento-2)}
.dia.salta{opacity:.4;text-decoration:line-through}
.checks label{display:flex;gap:.65rem;align-items:center;padding:.5rem 0;border-bottom:1px solid var(--borde)}
.checks label:last-child{border-bottom:0}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--acento);flex:none}
input[type=range]{width:100%;accent-color:var(--acento)}
input[type=number],input[type=date],textarea{font:inherit;font-size:16px;color:var(--texto);background:#0b0d11;border:1px solid var(--borde);border-radius:10px;padding:.5rem .6rem;min-height:44px;width:100%}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acento);outline-offset:1px}
.meta-sem{display:flex;justify-content:space-between;gap:.5rem;padding:.45rem 0;border-bottom:1px solid var(--borde);font-size:.92rem}
.meta-sem:last-child{border-bottom:0}
details{border-top:1px solid var(--borde);margin-top:.6rem;padding-top:.3rem}
details.tarjeta{border-top:1px solid var(--borde)}
summary{cursor:pointer;color:var(--acento-2);font-size:.9rem;padding:.25rem 0;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸ "}details[open]>summary::before{content:"▾ "}
.tabla{width:100%;border-collapse:collapse;font-size:.88rem}
.tabla th,.tabla td{padding:.4rem .3rem;border-bottom:1px solid var(--borde);text-align:left;vertical-align:top}
.tabla .n{text-align:right;white-space:nowrap}
.tabla tr.sub th{color:var(--acento-2);padding-top:.7rem}
.tabla tfoot td{font-weight:700;border-bottom:0}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(14,16,20,.98);border-top:1px solid var(--borde);padding-bottom:env(safe-area-inset-bottom)}
.nav button{appearance:none;background:none;border:0;color:var(--suave);font:inherit;font-size:.72rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1rem;min-height:var(--nav);cursor:pointer}
.nav .ico{font-size:1.25rem;line-height:1}
.nav button[aria-current=page]{color:var(--acento)}
.panel{position:fixed;inset:0;z-index:20;background:var(--fondo);overflow-y:auto;padding-bottom:calc(150px + env(safe-area-inset-bottom))}
.panel-top{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:.6rem;padding:.55rem .75rem;padding-top:calc(.55rem + env(safe-area-inset-top));background:rgba(14,16,20,.97);border-bottom:1px solid var(--borde)}
.panel-top div{display:flex;flex-direction:column;line-height:1.2}
.panel-cuerpo{max-width:640px;margin:0 auto;padding:1rem}
.ej-cab{display:flex;gap:.6rem;align-items:flex-start}
.num{flex:none;width:28px;height:28px;border-radius:50%;background:var(--tarjeta-2);display:grid;place-items:center;font-size:.85rem;font-weight:700}
.tags{display:flex;flex-wrap:wrap;gap:.3rem;margin:.3rem 0}
.tag{font-size:.74rem;padding:.12rem .5rem;border-radius:999px;background:var(--tarjeta-2);border:1px solid var(--borde);color:var(--suave)}
.tag.f{color:var(--acento-2);border-color:rgba(255,179,92,.45)}
.series{display:grid;gap:.4rem;margin-top:.5rem}
.serie{display:grid;grid-template-columns:2rem 1fr 1fr 2.9rem;gap:.4rem;align-items:center}
.serie .l{font-size:.78rem;color:var(--suave);text-align:center}
.serie.cab span{font-size:.72rem;color:var(--suave);text-align:center}
.serie button{padding:0;min-height:44px}
.barra-guardar{position:fixed;left:0;right:0;bottom:0;z-index:21;padding:.6rem 1rem calc(.6rem + env(safe-area-inset-bottom));background:rgba(14,16,20,.98);border-top:1px solid var(--borde)}
.barra-guardar .btn{max-width:608px;margin:0 auto;display:block}
.timer{position:fixed;left:.75rem;right:.75rem;bottom:calc(74px + env(safe-area-inset-bottom));z-index:30;max-width:620px;margin:0 auto;background:#241a12;border:1px solid var(--acento);border-radius:14px;padding:.6rem .8rem;display:flex;align-items:center;gap:.6rem}
.timer b{font-size:1.5rem;min-width:4.2rem;font-variant-numeric:tabular-nums}
.timer .barrita{flex:1;height:6px;border-radius:9px;background:#3a2a1d;overflow:hidden}
.barrita i{display:block;height:100%;width:0;background:var(--acento)}
.barra{height:8px;border-radius:9px;background:var(--tarjeta-2);overflow:hidden;margin-top:.2rem}
.barra i{display:block;height:100%;background:var(--acento)}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translateX(-50%);z-index:40;background:#22262f;border:1px solid var(--borde);border-radius:12px;padding:.6rem 1rem;font-size:.92rem;max-width:90vw;box-shadow:0 6px 24px rgba(0,0,0,.4)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.5rem .6rem}
.grid2 label{font-size:.8rem;color:var(--suave)}
.grafico{width:100%;max-width:640px;height:auto;display:block;margin:.4rem auto}
.fuera{border-top:1px solid var(--borde);padding-top:.5rem;margin-top:.5rem}
.fases li{margin-bottom:.6rem}.fases li.actual b{color:var(--acento-2)}
.borrar{background:none;border:0;color:var(--suave);font-size:1rem;cursor:pointer;padding:.2rem .5rem}
[hidden]{display:none!important}
.top-der{display:flex;gap:.4rem;align-items:center}
.cuenta{appearance:none;border:1px solid var(--borde);background:var(--tarjeta-2);color:var(--texto);border-radius:999px;padding:.25rem .65rem;font:inherit;font-size:.8rem;cursor:pointer;white-space:nowrap}
.cuenta.on{border-color:rgba(56,210,122,.6);color:var(--ok)}
select{font:inherit;font-size:16px;color:var(--texto);background:#0b0d11;border:1px solid var(--borde);border-radius:10px;padding:.5rem .6rem;min-height:44px;width:100%}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.fotos{display:grid;grid-template-columns:repeat(3,1fr);gap:.45rem;margin-top:.5rem}
.fotos figure{margin:0;position:relative}
.fotos img,.comparar img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;background:#000;display:block}
.fotos figcaption{font-size:.72rem;color:var(--suave);text-align:center}
.fotos .borrar{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.65);border-radius:8px;color:#fff}
.comparar{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-top:.5rem}
.uid{font-family:ui-monospace,monospace;font-size:.78rem;word-break:break-all;background:#0b0d11;border:1px solid var(--borde);border-radius:8px;padding:.4rem .5rem;display:block;margin:.3rem 0}
@media (min-width:900px){
  body{padding-bottom:30px;padding-left:210px}
  .nav{top:0;right:auto;width:210px;display:flex;flex-direction:column;gap:.2rem;padding:70px .6rem 1rem;border-top:0;border-right:1px solid var(--borde)}
  .nav button{flex:none;flex-direction:row;justify-content:flex-start;gap:.75rem;padding:0 .9rem;font-size:.95rem;min-height:46px;border-radius:10px}
  .nav button[aria-current=page]{background:var(--tarjeta-2)}
  main{max-width:1200px;padding:1.25rem}
  .tab.activa{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 1rem;align-items:start}
  .tab .ancho,.tab>.aviso{grid-column:1/-1}
  .timer{left:calc(210px + 1rem)}
  .fotos{grid-template-columns:repeat(6,1fr)}
  .comparar{grid-template-columns:repeat(6,1fr)}
}
</style>
</head>
<body>
<header class="top"><h1>🏋️ Mi rutina</h1><div class="top-der"><span id="pill" class="pill"></span><button id="cuenta" class="cuenta" data-acc="cuenta">☁️ Entrar</button></div></header>
<main>
  <section id="tab-hoy" class="tab activa" aria-label="Hoy"></section>
  <section id="tab-rutina" class="tab" aria-label="Rutina"></section>
  <section id="tab-dieta" class="tab" aria-label="Dieta"></section>
  <section id="tab-progreso" class="tab" aria-label="Progreso"></section>
  <section id="tab-guia" class="tab" aria-label="Guía"></section>
</main>
<div id="panel" class="panel" hidden role="dialog" aria-modal="true"></div>
<div id="timer" class="timer" hidden aria-live="polite">
  <b id="timer-num">0:00</b><div class="barrita"><i id="timer-barra"></i></div>
  <button class="btn sec mini" data-acc="timer-mas">+30 s</button>
  <button class="btn sec mini" data-acc="timer-parar">Parar</button>
</div>
<nav class="nav" aria-label="Secciones">
  <button data-tab="hoy" aria-current="page"><span class="ico">📅</span>Hoy</button>
  <button data-tab="rutina"><span class="ico">🏋️</span>Rutina</button>
  <button data-tab="dieta"><span class="ico">🍽️</span>Dieta</button>
  <button data-tab="progreso"><span class="ico">📈</span>Progreso</button>
  <button data-tab="guia"><span class="ico">📘</span>Guía</button>
</nav>
<div id="toast" class="toast" hidden role="status"></div>
<input type="file" id="archivo" accept=".txt,.json,text/plain,application/json" hidden>

<script>
(function () {
"use strict";

/* ==========================================================================
   PLAN - CAMBIAR AQUI
   Fechas (AAAA-MM-DD), calorias, sesiones, ejercicios y comidas.
   Ejercicio: n = nombre, s = series, r = [min, max] reps, e = esfuerzo
   (rir2, rir1, fallo, fallo+, duro), d = descanso en segundos,
   a = aproximaciones (barra, mancuerna, pm), opc = opcional.
   ========================================================================== */
var PLAN = {
  fases: [
    { id: "s0", nombre: "Semana 0 · Prueba", corto: "Semana 0", desde: "2026-11-23", hasta: "2026-11-29",
      kcal: 2400, kcalTexto: "Normal", p: 140, g: null, c: null,
      nota: "Come como siempre, pero ya con proteína alta, sin jugo y máximo 1 pan. Pesa tus porciones para aprender. Entrena dejando 2-3 reps en reserva para encontrar tus pesos. Esta semana: medidas, fotos y empezar la creatina." },
    { id: "def1", nombre: "Definición · Bloque 1", corto: "Definición", desde: "2026-11-30", hasta: "2026-12-20",
      kcal: 2000, p: 145, g: 60, c: 220, def: true,
      nota: "Meta: bajar unos 0.5 kg por semana. Entrena pesado: mantener tus pesos ya es ganar." },
    { id: "mant", nombre: "Mantenimiento · Navidad", corto: "Mantenimiento", desde: "2026-12-21", hasta: "2027-01-03",
      kcal: 2450, p: 140, g: 70, c: 315,
      nota: "Comes más (sobre todo carbohidratos) y disfrutas las fiestas sin culpa. La balanza sube 1-2 kg por agua y glucógeno: es normal, no es grasa." },
    { id: "def2", nombre: "Definición · Bloque 2", corto: "Definición", desde: "2027-01-04", hasta: "2027-02-28",
      kcal: 2000, p: 145, g: 60, c: 220, def: true,
      nota: "Igual que el bloque 1. En Carnaval (8 y 9 de febrero) comes a mantenimiento." },
    { id: "eval", nombre: "Evaluación", corto: "Evaluación", desde: "2027-03-01", hasta: "2099-12-31",
      kcal: 2000, p: 145, g: 60, c: 220,
      nota: "Mide todo y toma fotos. Con eso decidimos si sigues definiendo unas semanas o pasas a volumen limpio." }
  ],
  semanasDefinicion: 11,
  kcalMantenimiento: 2450,
  descargas: [
    { desde: "2026-12-28", hasta: "2027-01-03", nombre: "Fin de Año" },
    { desde: "2027-02-08", hasta: "2027-02-14", nombre: "Carnaval" }
  ],
  diasMantenimiento: [
    { fecha: "2027-02-08", nombre: "Carnaval" },
    { fecha: "2027-02-09", nombre: "Carnaval" }
  ],

  calentamiento: {
    pierna: "5 min de caminadora (caminando) o bici suave. Luego 10 balanceos de pierna por lado, 5 sentadillas profundas sin peso con pausa abajo y 10 puentes de glúteo. Después, las aproximaciones del primer ejercicio.",
    torso: "5 min suaves de caminadora o bici. Luego 15 face pull muy livianos, 10 círculos grandes de hombro y 15 rotaciones externas con polea liviana por brazo. Después, las aproximaciones del primer ejercicio.",
    brazos: "Lo mismo que el día de torso y, antes del primer ejercicio de brazo, 1 serie de 20 de curl y 1 de jalón de tríceps en polea, muy livianas, para calentar los codos."
  },

  sesiones: [
    { id: "PA", nombre: "Pierna A", corto: "Pierna A", foco: "Cuádriceps", dia: 0, min: 75, cal: "pierna", ej: [
      { id: "sentadilla", n: "Sentadilla con barra (barra alta)", s: 3, r: [5, 8], e: "rir1", d: 210, a: "barra",
        tip: "En la jaula, con las barras de seguridad un poco debajo de tu punto más bajo. Baja controlado (2-3 s) hasta tu profundidad de siempre y sube fuerte. Si una rep sale lenta o la técnica se rompe, esa es la última.",
        alt: "Sentadilla hack 3 × 8-12." },
      { id: "femoral-sentado", n: "Femoral sentado (máquina)", s: 3, r: [8, 12], e: "fallo", d: 120,
        tip: "Cadera bien atrás y torso un poco inclinado adelante: así el femoral se estira más y crece más que en el acostado. Sube fuerte y baja en 3 s.",
        alt: "Femoral acostado con una toalla doblada bajo el cojín duro." },
      { id: "extension-cuadriceps", n: "Extensión de cuádriceps", s: 3, r: [10, 15], e: "fallo+", d: 120,
        x: "Opcional, en la última serie: al llegar al fallo, sigue con 4-6 medias repeticiones en la parte de abajo (rodilla doblada).",
        tip: "Pausa de 1 s arriba y baja en 3 s." },
      { id: "aductores", n: "Aductores (máquina)", s: 2, r: [10, 15], e: "fallo", d: 90,
        tip: "Abre hasta sentir estiramiento y cierra apretando 1 s." },
      { id: "gemelos-pie", n: "Gemelos de pie (máquina)", s: 4, r: [8, 12], e: "fallo+", d: 90,
        x: "Opcional: al llegar al fallo, sigue con medias repeticiones en la parte de abajo (talón bajo) hasta no poder.",
        tip: "Abajo, pausa de 2 s con el talón lo más bajo posible: el gemelo crece más trabajando estirado. Sube completo y explosivo, rodillas casi rectas." },
      { id: "crunch-polea", n: "Crunch en polea (de rodillas)", s: 3, r: [10, 15], e: "fallo", d: 60,
        tip: "Cuerda junto a la cabeza. Enrolla la columna llevando las costillas hacia la cadera; no jales con los brazos ni bajes la cadera." }
    ]},
    { id: "TA", nombre: "Torso A", corto: "Torso A", foco: "Pecho alto y remos", dia: 1, min: 80, cal: "torso", ej: [
      { id: "press-inclinado-mancuernas", n: "Press inclinado con mancuernas (banco a 30°)", s: 3, r: [6, 10], e: "fallo", d: 180, a: "mancuerna", kgL: "kg c/u",
        tip: "Omóplatos juntos y abajo, codos a 45-60° del cuerpo, baja hasta sentir el pecho estirado. Las mancuernas se pueden soltar: al fallo, llévalas al pecho y gira a un lado. Para ahorrar tiempo puedes alternarlo con el remo (press, 90 s, remo, 90 s).",
        alt: "Press inclinado en máquina o en Smith." },
      { id: "remo-barra-t", n: "Remo en barra T (remo en punta)", s: 3, r: [6, 10], e: "fallo", d: 180,
        tip: "Pecho arriba y espalda neutra. Jala con los codos hacia la cadera, aprieta 1 s y baja estirando la espalda. Straps permitidos.",
        alt: "Remo con barra." },
      { id: "press-pecho-maquina", n: "Press de pecho en máquina", s: 2, r: [8, 12], e: "fallo", d: 150,
        tip: "Asiento a la altura que deje las manijas a media altura del pecho. Empuja sin bloquear los codos de golpe y baja lento.",
        alt: "Press plano con mancuernas." },
      { id: "jalon-pecho", n: "Jalón al pecho (agarre medio)", s: 2, r: [8, 12], e: "fallo", d: 120,
        tip: "Pecho hacia la barra; lleva los codos hacia abajo y atrás. Arriba, estira completo." },
      { id: "laterales-mancuerna", n: "Elevaciones laterales con mancuernas", s: 3, r: [8, 12], e: "fallo+", d: 120, kgL: "kg c/u",
        x: "Biserie (tu estilo): al terminar cada serie, toma mancuernas de la mitad del peso y sigue hasta el fallo.",
        tip: "Torso un poco inclinado adelante. Sube llevando el codo, no la mano, hasta la altura del hombro y baja en 2-3 s." },
      { id: "posterior-polea", n: "Deltoide posterior: cruce en polea alta", s: 3, r: [12, 20], e: "fallo", d: 90,
        tip: "Poleas a la altura de los hombros, cables cruzados. Brazos casi rectos: abre hacia los lados como abriendo una puerta corrediza, sin juntar los omóplatos. Peso liviano; si sientes la espalda, baja el peso." }

      "**Aproximaciones.** En el primer ejercicio pesado la página te calcula los pesos (≈50% × 8, 70% × 4, 85% × 2 de tu peso de trabajo).",
      "**Progresión doble.** Cada ejercicio tiene un rango (por ejemplo 6-10). Cuando haces el máximo del rango en todas las series, la próxima vez subes: la mancuerna siguiente, 2.5 kg en barra (5 kg en peso muerto) o una placa en máquina. La página te avisa.",

}
function limpiar(ej) {

}

/* ---------- Temporizador de descanso ---------- */
var timer = { fin: 0, total: 1, id: null }, audio = null;
function iniciarTimer(seg) {
  try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); if (audio.state === "suspended") audio.resume(); } catch (e) { audio = null; }
  timer.fin = Date.now() + seg * 1000; timer.total = seg;
  clearInterval(timer.id); timer.id = setInterval(tick, 250);
  $("#timer").hidden = false; tick();
}
function tick() {
  var resta = Math.max(0, Math.ceil((timer.fin - Date.now()) / 1000));
  $("#timer-num").textContent = mmss(resta);
  $("#timer-barra").style.width = (100 * (1 - resta / timer.total)) + "%";
  if (resta <= 0) {
    clearInterval(timer.id); timer.id = null;
    if (navigator.vibrate) navigator.vibrate([400, 200, 400]);
    pitido(); $("#timer-num").textContent = "¡Dale!";
    setTimeout(function () { if (!timer.id) $("#timer").hidden = true; }, 4000);
  }
}
function pararTimer() { clearInterval(timer.id); timer.id = null; $("#timer").hidden = true; }
function pitido() {
  if (!audio) return;
  try {
    [0, 0.35].forEach(function (t0) {
      var o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime + t0;
      o.frequency.value = 880; o.connect(g); g.connect(audio.destination);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.3, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
      o.start(t); o.stop(t + 0.3);
    });
  } catch (e) {}
}

  if (!xs.length) return null;
  return { lunes: lunes, prom: xs.reduce(function (a, p) { return a + p.kg; }, 0) / xs.length, n: xs.length };
}
function promediosSemanales() {
  var vistos = {}, out = [];
  datos.pesos.forEach(function (p) { var l = lunesDe(p.fecha); if (!vistos[l]) { vistos[l] = 1; out.push(promedioSemana(l)); } });
  return out.sort(function (a, b) { return a.lunes < b.lunes ? -1 : 1; });
}
function htmlAjuste() {

  if (semanaDef(u[2].lunes) < 3) return "<p class=\"chico suave\">Las 2 primeras semanas de definición la balanza baila por agua y creatina. El ajuste empieza en la semana 3.</p>";

}
function linea(serie, o) {
  o = o || {};
  if (serie.length < 2) return "<p class=\"chico suave\">" + esc(o.vacio || "Con 2 datos o más aparece la gráfica.") + "</p>";
  var extra = o.puntos || [], vs = serie.concat(extra).map(function (p) { return p.v; });
  var min = Math.min.apply(null, vs), max = Math.max.apply(null, vs), pad = Math.max(o.pad || 0.5, (max - min) * 0.15);
  min -= pad; max += pad;
  var desde = o.desde || serie[0].fecha, hasta = o.hasta || serie[serie.length - 1].fecha, span = Math.max(1, diasEntre(desde, hasta));
  var W = 320, H = 140, L = 36, R = 8, T = 10, B = 22;
  function x(f) { return L + Math.max(0, Math.min(span, diasEntre(desde, f))) / span * (W - L - R); }
  function y(val) { return T + (1 - (val - min) / (max - min)) * (H - T - B); }
  var pl = serie.map(function (p) { return x(p.fecha).toFixed(1) + "," + y(p.v).toFixed(1); }).join(" ");
  var marcas = o.marcas ? serie.map(function (p) { return "<circle cx=\"" + x(p.fecha).toFixed(1) + "\" cy=\"" + y(p.v).toFixed(1) + "\" r=\"2.5\" fill=\"#ffb35c\"/>"; }).join("") : "";

  return "<svg class=\"grafico\" viewBox=\"0 0 " + W + " " + H + "\" role=\"img\" aria-label=\"" + esc(o.titulo || "Gráfica") + "\">" +
    "<line x1=\"" + L + "\" y1=\"" + (H - B) + "\" x2=\"" + (W - R) + "\" y2=\"" + (H - B) + "\" stroke=\"#2a2f3a\"/>" +
    "<text x=\"2\" y=\"" + (T + 8) + "\" fill=\"#9ba3af\" font-size=\"10\">" + fmt(max, 1) + "</text><text x=\"2\" y=\"" + (H - B) + "\" fill=\"#9ba3af\" font-size=\"10\">" + fmt(min, 1) + "</text>" +
    "<text x=\"" + L + "\" y=\"" + (H - 6) + "\" fill=\"#9ba3af\" font-size=\"10\">" + bonita(desde) + "</text><text x=\"" + (W - R) + "\" y=\"" + (H - 6) + "\" fill=\"#9ba3af\" font-size=\"10\" text-anchor=\"end\">" + bonita(hasta) + "</text>" +
    "<polyline points=\"" + pl + "\" fill=\"none\" stroke=\"#9ba3af\" stroke-width=\"1.5\"/>" + marcas + pts + "</svg>";

  else { b.textContent = nube.error ? "☁️ Sin nube" : "☁️ Entrar"; b.classList.remove("on"); }
}
function htmlAvisoNube() {
  if (nube.user || !nube.A) return "";
  return "<div class=\"aviso ancho\">Entra con Google para guardar todo en la nube y verlo igual en el celular y la PC. <button class=\"btn mini\" data-acc=\"entrar\">Entrar con Google</button></div>";
}
function htmlCuenta() {
  if (!nube.A) return tarjeta("Tu cuenta", "<p class=\"chico suave\">" + (nube.error ? "No se pudo conectar con la nube (¿sin internet?). Lo que anotes queda en este equipo y se sube cuando entres." : "Conectando con la nube…") + "</p>", true);
  if (!nube.user) return "<div class=\"tarjeta ancho destacada\"><h2>Sincroniza celular y PC</h2><p class=\"chico\">Entra con tu cuenta de Google y todo lo que anotes se guarda en la nube. Lo que ya tienes en este equipo se sube la primera vez. Solo tu cuenta puede ver tus datos.</p><button class=\"btn\" data-acc=\"entrar\">Entrar con Google</button></div>";
  return tarjeta("Tu cuenta", "<p class=\"chico\">Conectado como <b>" + esc(nube.user.email || nube.user.displayName || "tu cuenta") + "</b>. Todo se sincroniza solo; sin internet se guarda en el equipo y se sube después.</p>" +
    "<details><summary>Código de tu cuenta (UID)</summary><p class=\"chico suave\">Sirve para cerrar la base de datos solo a tu cuenta.</p><code class=\"uid\">" + esc(nube.user.uid) + "</code><button class=\"btn sec mini\" data-acc=\"copiar-uid\">Copiar</button></details>" +
    "<button class=\"btn sec mini\" style=\"margin-top:.6rem\" data-acc=\"salir\">Cerrar sesión</button>", true);
}

/* ---------- GUIA ---------- */
function htmlGuia() {
  var G = PLAN.guia, fa = faseDe(hoy()).id;
  var h = tarjeta("Por qué este plan", lista(G.claves));
  h += "<div class=\"tarjeta\"><h2>Las fases</h2><ol class=\"fases chico\">" + PLAN.fases.map(function (f) {
    return "<li class=\"" + (f.id === fa ? "actual" : "") + "\"><b>" + esc(f.nombre) + (f.id === fa ? " ← estás aquí" : "") + "</b><br><span class=\"suave\">" + bonita(f.desde) + (f.hasta < "2099" ? " – " + bonita(f.hasta) : " en adelante") + " · " + (f.kcalTexto ? "come normal" : "≈" + f.kcal + " kcal") + "</span><br>" + esc(f.nota) + "</li>";
  }).join("") + "</ol><p class=\"chico suave\">Descargas: " + PLAN.descargas.map(function (d) { return bonita(d.desde) + " – " + bonita(d.hasta) + " (" + d.nombre + ")"; }).join(" y ") + ".</p></div>";
  h += tarjeta("Cómo entrenar", lista(G.entreno));
  h += tarjeta("Molestias", lista(G.molestias));
  h += tarjeta("Sueño", lista(G.sueno));
  h += tarjeta("Creatina, café y suplementos", lista(G.suplementos));
  h += tarjeta("Cómo usar esta página", lista(G.pagina));
  h += tarjeta("Estudios en los que se basa", lista(G.fuentes));
  return h;
}

/* ---------- Respaldo ---------- */
function exportar() {
  var nombre = "rutina-respaldo-" + hoy() + ".txt", texto = JSON.stringify(datos);
  var marcar = function () { datos.ajustes.ultimoRespaldo = hoy(); guardar(); render(); };
  var archivo = null;
  try { archivo = new File([texto], nombre, { type: "text/plain" }); } catch (e) {}
  if (archivo && navigator.canShare && navigator.canShare({ files: [archivo] })) {
    navigator.share({ files: [archivo], title: "Respaldo de mi rutina" }).then(marcar).catch(function () {});
    return;
  }
  var url = URL.createObjectURL(new Blob([texto], { type: "text/plain" })), a = document.createElement("a");
  a.href = url; a.download = nombre; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(url); }, 3000);
  marcar(); aviso("Respaldo descargado ✔");
}
function importar(archivo) {
  var lector = new FileReader();
  lector.onload = function () {
    var d; try { d = JSON.parse(lector.result); } catch (e) { d = null; }
    if (!d || d.version !== 1 || !Array.isArray(d.registros)) { aviso("Ese archivo no es un respaldo válido."); return; }
    if (!confirm("Esto reemplaza los datos de este celular por los del respaldo. ¿Seguir?")) return;
    var sub = datos.ajustes.subidoA; datos = normalizar(d); datos.ajustes.subidoA = sub; guardar(); aviso("Respaldo cargado ✔"); render();
    if (nube.user) subirTodo().catch(errNube);
  };
  lector.readAsText(archivo);
}

/* ---------- Avisos ---------- */
var avisoT = null;
function aviso(t) { var el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(avisoT); avisoT = setTimeout(function () { el.hidden = true; }, 2600); }

/* ---------- Eventos ---------- */
function guardarPeso(fecha, kg) {
  if (kg == null || kg < 30 || kg > 200) { aviso("Escribe tu peso en kg."); return; }
  datos.pesos = datos.pesos.filter(function (p) { return p.fecha !== fecha; });
  datos.pesos.push({ fecha: fecha, kg: kg }); datos.pesos.sort(porFecha);
  nubeSet({ pesos: o(fecha, kg) });
  guardar(); aviso("Peso guardado ✔"); render();
}
document.addEventListener("click", function (ev) {
  var b = ev.target.closest("[data-tab],[data-acc]"); if (!b) return;
  if (b.dataset.tab) { irA(b.dataset.tab); return; }
  var acc = b.dataset.acc, s = hoy();
  if (acc === "abrir") abrirSesion(b.dataset.id);
  else if (acc === "cerrar") cerrarSesion(false);
  else if (acc === "guardar-sesion") guardarSesion();
  else if (acc === "timer") iniciarTimer(+b.dataset.seg);
  else if (acc === "timer-mas") { timer.fin += 30000; timer.total += 30; if (!timer.id) { timer.id = setInterval(tick, 250); $("#timer").hidden = false; } tick(); }
  else if (acc === "timer-parar") pararTimer();
  else if (acc === "guardar-peso") guardarPeso(s, numero($("#peso-hoy").value));
  else if (acc === "guardar-peso2") guardarPeso($("#peso-fecha").value || s, numero($("#peso-kg").value));
  else if (acc === "borrar-peso") { datos.pesos = datos.pesos.filter(function (p) { return p.fecha !== b.dataset.f; }); nubeDel("pesos", b.dataset.f); guardar(); render(); }
  else if (acc === "guardar-cintura") {
    var cm = numero($("#cintura-cm").value); if (cm == null || cm < 40 || cm > 200) { aviso("Escribe la cintura en cm."); return; }
    datos.cinturas = datos.cinturas.filter(function (c) { return c.fecha !== s; }); datos.cinturas.push({ fecha: s, cm: cm }); datos.cinturas.sort(porFecha);
    nubeSet({ cinturas: o(s, cm) });
    guardar(); aviso("Cintura guardada ✔"); render();
  }
  else if (acc === "borrar-cintura") { datos.cinturas = datos.cinturas.filter(function (c) { return c.fecha !== b.dataset.f; }); nubeDel("cinturas", b.dataset.f); guardar(); render(); }
  else if (acc === "guardar-medidas") {
    var m = { fecha: s }, alguno = false;
    $$("[data-medida]").forEach(function (i) { var n = numero(i.value); if (n != null && n > 0) { m[i.dataset.medida] = n; if (i.dataset.medida !== "estatura") alguno = true; } });
    if (!alguno) { aviso("Escribe al menos una medida."); return; }
    datos.medidas = datos.medidas.filter(function (x) { return x.fecha !== s; }); datos.medidas.push(m); datos.medidas.sort(porFecha);
    if (m.peso) { datos.pesos = datos.pesos.filter(function (p) { return p.fecha !== s; }); datos.pesos.push({ fecha: s, kg: m.peso }); datos.pesos.sort(porFecha); }
    if (m.cintura) { datos.cinturas = datos.cinturas.filter(function (c) { return c.fecha !== s; }); datos.cinturas.push({ fecha: s, cm: m.cintura }); datos.cinturas.sort(porFecha); }
    var copia = Object.assign({}, m); delete copia.fecha;
    var up = { medidas: o(s, copia) }; if (m.peso) up.pesos = o(s, m.peso); if (m.cintura) up.cinturas = o(s, m.cintura);
    nubeSet(up);
    guardar(); aviso("Medidas guardadas ✔"); render();
  }
  else if (acc === "borrar-medida") { if (confirm("¿Borrar las medidas del " + bonita(b.dataset.f) + "?")) { datos.medidas = datos.medidas.filter(function (x) { return x.fecha !== b.dataset.f; }); nubeDel("medidas", b.dataset.f); guardar(); render(); } }
  else if (acc === "borrar-registro") { if (confirm("¿Borrar esta sesión del historial?")) { datos.registros = datos.registros.filter(function (r) { return !(r.fecha === b.dataset.f && r.sesion === b.dataset.id); }); nubeRegDel(b.dataset.f, b.dataset.id); guardar(); render(); } }
  else if (acc === "exportar") exportar();
  else if (acc === "importar") $("#archivo").click();
  else if (acc === "borrar-todo") {
    if (confirm(nube.user ? "¿Borrar TODOS tus registros de la nube y de este equipo?" : "¿Borrar TODOS tus registros de este equipo?") && confirm("Seguro? Esto no se puede deshacer si no tienes respaldo.")) {
      var subido = datos.ajustes.subidoA;
      datos = vacio(); datos.ajustes.subidoA = subido; guardar(); render();
      if (nube.user) borrarNube().then(function () { aviso("Datos borrados."); }).catch(errNube); else aviso("Datos borrados.");
    }
  }
  else if (acc === "cuenta") { if (nube.user) irA("progreso"); else entrar(); }
  else if (acc === "entrar") entrar();
  else if (acc === "salir") salir();
  else if (acc === "copiar-uid") { if (navigator.clipboard) navigator.clipboard.writeText(nube.user.uid).then(function () { aviso("UID copiado ✔"); }); }
  else if (acc === "elegir-foto") $("#foto-archivo").click();
  else if (acc === "borrar-foto") { if (confirm("¿Borrar esta foto?")) nube.F.deleteDoc(nube.F.doc(nube.db, "usuarios", nube.user.uid, "fotos", b.dataset.id)).catch(errNube); }
});
document.addEventListener("change", function (ev) {
  var t = ev.target, s = hoy();
  if (t.dataset.diario) { var d = datos.diario[s] = datos.diario[s] || {}; d[t.dataset.diario] = t.checked; nubeSet({ diario: o(s, o(t.dataset.diario, t.checked)) }); guardar(); }
  else if (t.dataset.semanal) { var l = lunesDe(s), w = datos.semanal[l] = datos.semanal[l] || {}; w[t.dataset.semanal] = t.checked; nubeSet({ semanal: o(l, o(t.dataset.semanal, t.checked)) }); guardar(); }
  else if (t.hasAttribute("data-sueno")) { var dd = datos.diario[s] = datos.diario[s] || {}; dd.sueno = +t.value; nubeSet({ diario: o(s, { sueno: +t.value }) }); guardar(); }
  else if (t.hasAttribute("data-ej-sel")) { ejSel = t.value; render(); }
  else if (t.hasAttribute("data-hist")) { histSel = t.value; render(); }
  else if (t.dataset.cmp) { if (t.dataset.cmp === "a") cmpA = t.value; else cmpB = t.value; render(); }
  else if (t.id === "foto-archivo" && t.files && t.files[0]) { subirFoto(t.files[0]); t.value = ""; }
  else if (t.id === "archivo" && t.files && t.files[0]) { importar(t.files[0]); t.value = ""; }
  if ((t.dataset.diario || t.dataset.semanal) && actual === "hoy") render();
});
document.addEventListener("input", function (ev) {
  var t = ev.target;
  if (t.hasAttribute("data-sueno")) $("#sueno-val").textContent = t.value;
  if (abierta && panel.contains(t) && (t.dataset.ej || t.id === "nota-sesion")) guardarBorrador();
});
document.addEventListener("visibilitychange", function () {
  if (document.visibilityState !== "visible") return;
  if (abierta) pedirPantalla();
  if (timer.id) tick();
  if (!abierta && hoy() !== ultimoDia) render();
});

window.addEventListener("online", pintarCuenta);
window.addEventListener("offline", pintarCuenta);
render();
cargarFirebase();
})();
